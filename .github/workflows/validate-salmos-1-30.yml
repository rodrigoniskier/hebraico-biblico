name: Validate Psalms 1-60

on:
  push:
    branches: [salmos-31-60-revisao, salmos-estruturais]
  pull_request:
    branches: [salmos-estruturais]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed Psalms
        run: node scripts/validate-salmos-1-30.cjs

      - name: Validate browser modules
        run: node scripts/validate-html-modules.cjs

      - name: Smoke test interface
        run: node scripts/smoke-salmos-ui.cjs

      - name: Validate production resilience
        run: |
          node --check runtime-guard.js
          node --check reviewed-31-60-runtime.js
          grep -q "cdn.jsdelivr.net/gh/rodrigoniskier/hebraico-biblico" index.html
          grep -q "80fa9567a8fed76f9dccf4c0afdc067d4e0b8ad9" index.html
          grep -q "analysis-51-60.js" index.html
