name: Validate Psalms 1-30

on:
  push:
    branches: [salmos-1-30-revisao, salmos-estruturais]
  pull_request:
    branches: [salmos-estruturais]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed Psalms
        run: node scripts/validate-salmos-1-30.cjs

      - name: Smoke test interface
        run: node scripts/smoke-salmos-ui.cjs

      - name: Validate production bootstrap
        run: |
          node --check runtime-guard.js
          grep -q "cdn.jsdelivr.net/gh/rodrigoniskier/hebraico-biblico" index.html
          grep -q "runtime-guard.js" index.html
          grep -q "71ad310a4db96bb80d18615d28d855a443ec52a3" index.html
