name: Validate Psalms 1-150

on:
  push:
    branches: [salmos-120-150-revisao, salmos-estruturais]
  pull_request:
    branches: [salmos-estruturais]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed Psalms
        run: node scripts/validate-salmos-1-30.cjs

      - name: Audit analysis sources
        run: node scripts/audit-sources.cjs

      - name: Test Masoretic colometry
        run: node scripts/test-colometry.cjs

      - name: Validate browser modules
        run: node scripts/validate-html-modules.cjs

      - name: Smoke test interface
        run: node scripts/smoke-salmos-ui.cjs

      - name: Validate production resilience
        run: |
          node --check runtime-guard.js
          node --check source-registry.js
          node --check reviewed-31-60-runtime.js
          node --check reviewed-61-90-runtime.js
          node --check reviewed-91-118-runtime.js
          node --check reviewed-119-runtime.js
          node --check reviewed-120-150-runtime.js
          node --check analysis-120-130.js
          node --check analysis-131-140.js
          node --check analysis-141-150.js
          grep -q "cdn.jsdelivr.net/gh/rodrigoniskier/hebraico-biblico" index.html
          grep -q "bed355801f418c5aec5acc7892e9cb7f2ebfb145" index.html
          grep -q "Desenvolvido por Rodrigo Niskier Ferreira Barbosa" index.html
          grep -q "Desenvolvido por Rodrigo Niskier Ferreira Barbosa" reviewed-120-150-runtime.js
          grep -q "source-registry.js" reviewed-119-runtime.js
          grep -q "analysis-141-150.js" reviewed-119-runtime.js
          grep -q "reviewed-120-150-runtime.js" reviewed-119-runtime.js
