<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#13251d">
  <title>A Medida do Louvor · Inicializando</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f2e8;color:#172018;font-family:Inter,system-ui,sans-serif}
    .boot{max-width:620px;margin:24px;padding:28px;border:1px solid #d8d2c3;border-radius:16px;background:#fffdf7;box-shadow:0 12px 45px #17201812}
    h1{font-family:Georgia,serif;margin:0 0 10px;color:#13251d}.small{font-size:.82rem;line-height:1.55;color:#667269}
    .bar{height:7px;border-radius:99px;background:#e0dbcf;overflow:hidden;margin-top:18px}.bar span{display:block;width:45%;height:100%;background:#b18b48;animation:move 1.2s ease-in-out infinite alternate}
    .error{color:#8b3a32;background:#fff1ef;padding:12px;border-radius:10px;margin-top:14px;line-height:1.5}a{color:#315e68}@keyframes move{to{transform:translateX(120%)}}
  </style>
</head>
<body>
  <main class="boot" id="boot">
    <h1>A Medida do Louvor</h1>
    <p>Carregando o Atlas Estrutural dos Salmos…</p>
    <p class="small">A versão de produção é conferida contra uma cópia imutável e validada do repositório para evitar páginas vazias quando o host deixa de servir algum módulo.</p>
    <div class="bar"><span></span></div>
  </main>
  <script>
  (async function(){
    const version='bed355801f418c5aec5acc7892e9cb7f2ebfb145';
    const base=`https://cdn.jsdelivr.net/gh/rodrigoniskier/hebraico-biblico@${version}/`;
    const boot=document.getElementById('boot');
    try{
      const response=await fetch(base+'salmos.html',{cache:'no-store',mode:'cors'});
      if(!response.ok) throw new Error(`CDN respondeu HTTP ${response.status}`);
      let html=await response.text();
      if(!html.includes('id="psalmList"')||!html.includes('/render.js')||!html.includes('/reviewed-31-60-runtime.js')) throw new Error('A cópia validada da interface-base está incompleta.');
      const chain118=await fetch(base+'reviewed-61-90-runtime.js',{cache:'no-store',mode:'cors'});
      if(!chain118.ok || !(await chain118.text()).includes('analysis-111-118.js')) throw new Error('A cadeia validada dos Salmos 91–118 está incompleta.');
      const chain119=await fetch(base+'reviewed-91-118-runtime.js',{cache:'no-store',mode:'cors'});
      const chain119Text=chain119.ok?await chain119.text():'';
      if(!chain119.ok || !chain119Text.includes('analysis-119.js') || !chain119Text.includes('reviewed-119-runtime.js')) throw new Error('A camada dedicada e validada do Salmo 119 está incompleta.');
      html=html.replace(/src="\/([^\"]+\.js)"/g,(_,file)=>`src="${base}${file}"`);
      html=html.replace('</head>',`<script src="${base}runtime-guard.js"><\/script></head>`);
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      boot.innerHTML=`<h1>Não foi possível iniciar a página</h1><div class="error"><b>Falha de carregamento:</b> ${String(error.message||error)}</div><p class="small">O conteúdo não foi perdido; a publicação não conseguiu baixar a versão validada. Tente atualizar a página. Se persistir, use o repositório enquanto a hospedagem é corrigida.</p><p><a href="https://github.com/rodrigoniskier/hebraico-biblico/tree/salmos-estruturais" target="_blank" rel="noopener noreferrer">Abrir o projeto no GitHub ↗</a></p>`;
    }
  })();
  </script>
</body>
</html>
